global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "http-server"
    static_configs:
      - targets: ["http_server:8001"]

  - job_name: "outbox-poller"
    static_configs:
      - targets: ["outbox_poller:8001"]

  - job_name: "notification-poller"
    static_configs:
      - targets: ["notification_poller:8001"]

  - job_name: "price-sync"
    static_configs:
      - targets: ["price_sync:8001"]

  - job_name: "product-sync"
    static_configs:
      - targets: ["product_sync:8001"]

  - job_name: "expiry-checker"
    static_configs:
      - targets: ["expiry_checker:8001"]

  - job_name: "eth-listener"
    static_configs:
      - targets: ["eth_listener:8001"]

  - job_name: "transaction-orchestrator"
    static_configs:
      - targets: ["transaction_orchestrator:8001"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
