services:
  http_server:
    image: chrima-backend:latest
    container_name: chrima_http_server_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run uvicorn chrima.api.app:app --host 0.0.0.0 --port 8000
    networks:
      - chrima_network
    ports:
      - 8000:8000

networks:
  chrima_network:
    name: chrima_network
    external: true
