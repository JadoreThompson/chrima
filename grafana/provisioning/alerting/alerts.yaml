apiVersion: 1
groups:
  - orgId: 1
    name: Dev Evaluation Group
    folder: log error alerts
    interval: 1m
    rules:
      - uid: bfw9mlnqx2hvkc
        title: Error Alerts
        condition: C
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: 'sum by (logger, traceId) (count_over_time({job="chrima"} | json | level="ERROR" [5m])) or vector(0)'
              editorMode: code
              queryType: range
              refId: A
              instant: false
              range: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: reduce
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: 'ERROR in {{ $labels.logger }} (traceId={{ if $labels.traceId }}{{ $labels.traceId }}{{ else }}n/a{{ end }}) — {{ $values.B.Value }} error(s) in last 5m'
          description: 'Found {{ $values.B.Value }} error log(s) in last 5m — logger={{ $labels.logger }}, traceId={{ if $labels.traceId }}{{ $labels.traceId }}{{ else }}n/a{{ end }}, job=chrima. Check Logs dashboard and Tempo trace.'
        labels:
          severity: error
        notification_settings:
          receiver: Telegram
