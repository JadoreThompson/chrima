aws:
  region: "${AWS_REGION:us-east-1}"
  access-key: "${AWS_ACCESS_KEY_ID:test}"
  secret-key: "${AWS_SECRET_ACCESS_KEY:test}"
  ses:
    endpoint: "${AWS_SES_ENDPOINT:http://localhost:4566}"
    from: "${AWS_SES_FROM:no-reply@chrima.local}"

spring:
  application:
    name: chrima
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chrima}"
    username: "${DB_USERNAME:chrima}"
    password: "${DB_PASSWORD:chrima}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: "${MAIL_HOST:localhost}"
    port: ${MAIL_PORT:1025}
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

notification:
  polling:
    delay: 5000
    batch-size: 100
    max-attempts: 3
  dlq:
    initial-delay: 5s
    polling-delay: 5s
    max-attempts: 5
    backoff-multiplier: 2.0
    batch-size: 100

events:
  polling:
    delay: 5000
    batch-size: 100
    max-attempts: 3
  dlq:
    initial-delay: 5s
    polling-delay: 5s
    max-attempts: 5
    backoff-multiplier: 2.0
    batch-size: 100

discord:
  token: "${DISCORD_TOKEN:}"
  polling:
    enabled: true
    fixed-delay: 5000
    initial-delay: 1000
    batch-size: 100
    max-attempts: 3
  dlq:
    initial-delay: 5s
    polling-delay: 5s
    max-attempts: 5
    backoff-multiplier: 2.0
    batch-size: 100
  test:
    guild-id: "${DISCORD_TEST_GUILD_ID:}"
    channel-id: "${DISCORD_TEST_CHANNEL_ID:}"

subscription:
  expiry:
    enabled: true
    fixed-delay: 3600000
    initial-delay: 60000
    notification-cooldown: 21600
    expiry-window: 43200
    max-attempts: 2

logging:
  file:
    name: logs/chrima.log
  level:
    com.chrima: INFO
    org.hibernate.SQL: WARN
  pattern:
    correlation: "[app=${spring.application.name:chrima} traceId=%mdc{traceId} spanId=%mdc{spanId}] "

management:
  tracing:
    enabled: true
    sampling:
      probability: "${TRACING_SAMPLING_PROBABILITY:1.0}"
  otlp:
    tracing:
      endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces"
      timeout: 10s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  observations:
    annotations:
      enabled: true

cors:
  frontend-url: http://localhost:3001