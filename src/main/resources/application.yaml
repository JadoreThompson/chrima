aws:
  region: "${AWS_REGION:us-east-1}"
  access-key: "${AWS_ACCESS_KEY_ID:test}"
  secret-key: "${AWS_SECRET_ACCESS_KEY:test}"
  ses:
    endpoint: "${AWS_SES_ENDPOINT:http://localhost:4566}"
    from: "${AWS_SES_FROM:no-reply@chrima.local}"

spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chrima}"
    username: "${DB_USERNAME:chrima}"
    password: "${DB_PASSWORD:chrima}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: "${MAIL_HOST:localhost}"
    port: ${MAIL_PORT:1025}
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

notification:
  polling:
    delay: 5000
    batch-size: 100
    max-attempts: 3
  dlq:
    initial-delay: 5s
    polling-delay: 5s
    max-attempts: 5
    backoff-multiplier: 2.0
    batch-size: 100
