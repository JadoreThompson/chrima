services:
  loki:
    image: grafana/loki:3.0.0
    container_name: chrima_loki_${ENVIRONMENT}
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chrima_network
    ports:
      - 4100:3100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus
    container_name: chrima_prometheus_${ENVIRONMENT}
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    networks:
      - chrima_network
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana
    container_name: chrima_grafana_${ENVIRONMENT}
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    networks:
      - chrima_network
    ports:
      - 3000:3000
    volumes:
      - ./grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards

networks:
  chrima_network:
    name: chrima_network
    external: true
