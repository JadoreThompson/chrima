services:
  # Infrastructure
  postgres:
    image: postgres:18
    container_name: chrima_postgres_${ENVIRONMENT}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - chrima_network
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: chrima_redis_${ENVIRONMENT}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - chrima_network
    volumes:
      - redis:/data

  kafka:
    image: apache/kafka:4.0.1
    container_name: chrima_kafka_${ENVIRONMENT}
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - chrima_network
    volumes:
      - kafka:/var/lib/kafka/data

  # Application

  http_server:
    image: chrima-backend:latest
    container_name: chrima_http_server_${ENVIRONMENT}
    working_dir: /app
    command:
      - bash
      - -c
      - |
        uv run src/main.py alembic write &&
        uv run src/main.py db upgrade &&
        cd src &&
        uv run uvicorn chrima.api.app:app --host 0.0.0.0 --port 8000
    networks:
      - chrima_network
    ports:
      - 8000:8000
    restart: unless-stopped

  outbox_poller:
    image: chrima-backend:latest
    container_name: chrima_outbox_poller_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py event-bus outbox run --interval 5 --batch-size 10
    networks:
      - chrima_network
    restart: unless-stopped

  notification_poller:
    image: chrima-backend:latest
    container_name: chrima_notification_poller_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py notification --interval 5 --batch-size 100 --timeout 30
    networks:
      - chrima_network
    restart: unless-stopped

  price_sync:
    image: chrima-backend:latest
    container_name: chrima_price_sync_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py price sync run
    networks:
      - chrima_network
    restart: unless-stopped

  product_sync:
    image: chrima-backend:latest
    container_name: chrima_product_sync_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py product sync run
    networks:
      - chrima_network
    restart: unless-stopped

  expiry_checker:
    image: chrima-backend:latest
    container_name: chrima_expiry_checker_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py subscription expiry-checker run --interval 3600 --notification-cooldown 21600 --expiry-window 43200 --max-attempts 2
    networks:
      - chrima_network
    restart: unless-stopped

  eth_listener:
    image: chrima-backend:latest
    container_name: chrima_eth_listener_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py transaction listener eth --poll-interval 1
    networks:
      - chrima_network
    restart: unless-stopped

  transaction_orchestrator:
    image: chrima-backend:latest
    container_name: chrima_transaction_orchestrator_${ENVIRONMENT}
    working_dir: /app/src
    command: uv run python main.py transaction orchestrator
    networks:
      - chrima_network
    restart: unless-stopped

  # Observability

  loki:
    image: grafana/loki:3.0.0
    container_name: chrima_loki_${ENVIRONMENT}
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chrima_network
    volumes:
      - loki:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus
    container_name: chrima_prometheus_${ENVIRONMENT}
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus:/prometheus
    networks:
      - chrima_network

  tempo-init:
    image: alpine:latest
    user: root
    volumes:
      - tempo:/tmp/tempo
    command: chown -R 10001:10001 /tmp/tempo

  tempo:
    image: grafana/tempo:2.8.2
    container_name: chrima_tempo_${ENVIRONMENT}
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      - chrima_network
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/tmp/tempo

  grafana:
    image: grafana/grafana
    container_name: chrima_grafana_${ENVIRONMENT}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    networks:
      - chrima_network
    volumes:
      - ./grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana:/var/lib/grafana

networks:
  chrima_network:
    name: chrima_network
    driver: bridge
    attachable: true

volumes:
  postgres:
  redis:
  kafka:
  loki:
  prometheus:
  tempo:
  grafana:
