services:
  postgres:
    image: postgres:18
    container_name: chrima_postgres_${ENVIRONMENT}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - chrima_network
    ports:
      - ${POSTGRES_PORT}:5432

  redis:
    image: redis:7
    container_name: chrima_redis_${ENVIRONMENT}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    networks:
      - chrima_network
    ports:
      - ${REDIS_PORT}:6379

networks:
  chrima_network:

volumes:
  postgres:
  redis:
