services:
  postgres:
    image: postgres:16-alpine
    container_name: chrima-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - chrima-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chrima} -d ${DB_NAME:-chrima}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.0.0
    container_name: chrima-loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - chrima-network
    volumes:
      - loki:/loki
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus
    container_name: chrima-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus:/prometheus
    networks:
      - chrima-network

  tempo-init:
    image: alpine:latest
    user: root
    volumes:
      - tempo:/tmp/tempo
    command: chown -R 10001:10001 /tmp/tempo

  tempo:
    image: grafana/tempo:2.8.2
    container_name: chrima-tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks:
      - chrima-network
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/tmp/tempo

  grafana:
    image: grafana/grafana
    container_name: chrima-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
    networks:
      - chrima-network
    volumes:
      #      - ./grafana/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      #      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana:/var/lib/grafana

  ministack:
    image: ministackorg/ministack:latest
    container_name: chrima-ministack
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: "${AWS_REGION}"
      PERSIST_STATE: 1

volumes:
  postgres-data:
    driver: local
  loki:
    driver: local
  prometheus:
    driver: local
  tempo:
    driver: local
  grafana:
    driver: local
  ministack:
    driver: local

networks:
  chrima-network:
    name: chrima-network
    driver: bridge
